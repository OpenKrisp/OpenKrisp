[package]
name = "openkrisp-desktop"
description = "Tauri desktop control plane for OpenKrisp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "openkrisp_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "openkrisp-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop-smoke = ["dep:denoise-dfn"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
denoise-dfn = { path = "../../../crates/denoise-dfn", optional = true }
audio-engine = { path = "../../../crates/audio-engine", features = ["aec-prototype"] }
audio-protocol = { path = "../../../crates/audio-protocol" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-updater = "=2.12.0"
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "=1.53.1", features = ["time"] }

[dev-dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
tauri = { version = "=2.11.5", features = ["test"] }

[lints]
workspace = true
