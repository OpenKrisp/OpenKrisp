[package]
name = "openkrisp-desktop"
description = "Tauri desktop control plane for OpenKrisp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
name = "openkrisp_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "openkrisp-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
audio-engine = { path = "../../../crates/audio-engine", features = ["aec-prototype"] }
audio-protocol = { path = "../../../crates/audio-protocol" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[lints]
workspace = true
