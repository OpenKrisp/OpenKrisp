# A dedicated CI VM. No host home, project directory or SSH agent is shared.
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
cpus: 8
memory: 16GiB
disk: 160GiB
mounts: []
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260321/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:1ea801e659d2f5035ac294e0faab0aac9b6ba66753df933ba5c7beab0c689bd0
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install --yes --no-install-recommends \
        ca-certificates curl git build-essential pkg-config python3 python3-venv \
        docker.io qemu-user-static binfmt-support libicu74 libssl3t64 rsync unzip zstd
      # Install GitHub CLI from its signed upstream repository, not Ubuntu's older package.
      curl --fail --location --silent --show-error --retry 3 \
        --output /tmp/openkrisp-githubcli-keyring.gpg \
        https://cli.github.com/packages/githubcli-archive-keyring.gpg
      printf '%s  %s\n' \
        6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b \
        /tmp/openkrisp-githubcli-keyring.gpg | sha256sum --check
      install -d -m 0755 /etc/apt/keyrings
      install -m 0644 /tmp/openkrisp-githubcli-keyring.gpg /etc/apt/keyrings/githubcli-archive-keyring.gpg
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n' \
        "$(dpkg --print-architecture)" > /etc/apt/sources.list.d/github-cli.list
      apt-get update
      apt-get install --yes --no-install-recommends gh
      gh api --help | grep -- --slurp
      systemctl enable --now docker
      update-binfmts --enable qemu-x86_64
      usermod -aG docker "{{.User}}"
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail
      if ! command -v cargo >/dev/null; then
        curl --fail --location --silent --show-error https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain 1.98.0
      fi
      mkdir -p "$HOME/actions-runner"
