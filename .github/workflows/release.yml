name: Release
run-name: ${{ github.event_name == 'workflow_run' && format('Prepare release after CI {0}', github.event.workflow_run.head_sha) || format('{0} {1}', inputs.operation, inputs.tag) }}

# A version merge starts preparation only after its main CI run succeeds.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a draft, or publish its verified files without rebuilding
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      tag:
        description: Existing version tag on main (for example v0.1.0-beta.2)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag, version, and CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
      automatic: ${{ steps.validate.outputs.automatic }}
      operation: ${{ steps.validate.outputs.operation }}
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      version: ${{ steps.validate.outputs.version }}
      ci_run: ${{ steps.validate.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve the tested version and release policy
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$GITHUB_EVENT_NAME" = workflow_run; then
            python3 scripts/github-release.py auto-plan
          else
            python3 scripts/github-release.py validate --tag "$RELEASE_TAG"
          fi

  tag:
    name: Tag the tested version
    needs: validate
    if: needs.validate.outputs.ready == 'true' && needs.validate.outputs.automatic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create the version tag without moving existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/github-release.py create-tag --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  build-macos:
    name: Build and verify Apple Silicon installer
    needs: [validate, tag]
    if: >-
      always() && needs.validate.result == 'success' && needs.validate.outputs.ready == 'true' &&
      needs.validate.outputs.operation == 'prepare' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_CI_RUN_ID: ${{ needs.validate.outputs.ci_run }}
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      APPLE_SIGNING_IDENTITY: '-'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      OPENKRISP_UPDATER_PUBLIC_KEY: ${{ vars.OPENKRISP_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check native target and install build dependencies
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv target/aec-tools
          target/aec-tools/bin/python -m pip install meson==1.9.2 ninja==1.13.0
          npm ci --prefix apps/desktop
          cargo fetch --locked
      - name: Collect pinned dependency notices and source archives
        run: python3 scripts/prepare-release-notices.py --target aarch64-apple-darwin --fetch-missing
      - name: Build optimized community app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$OPENKRISP_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          UPDATER_KEY_CONFIG=$(python3 -c 'import json, os; print(json.dumps({"plugins": {"updater": {"pubkey": os.environ["OPENKRISP_UPDATER_PUBLIC_KEY"]}}}))')
          npm run --prefix apps/desktop tauri -- build --ci \
            --config src-tauri/tauri.community.conf.json \
            --config src-tauri/tauri.updater.conf.json --config "$UPDATER_KEY_CONFIG" -- --locked --offline
          codesign --verify --deep --strict target/release/bundle/macos/OpenKrisp.app
          test "$(lipo -archs target/release/bundle/macos/OpenKrisp.app/Contents/MacOS/openkrisp-desktop)" = arm64
          cargo run --release --locked --offline -p openkrisp-desktop --example verify_updater -- \
            target/release/bundle/macos/OpenKrisp.app.tar.gz target/release/bundle/macos/OpenKrisp.app.tar.gz.sig
      - name: Run installer tests and release performance checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          cargo test --release --locked --offline -p audio-engine --features aec-prototype \
            production_aec_dfn_graph_timing -- --ignored --nocapture
          cargo test --release --locked --offline -p audio-engine --test dfn_recovery \
            production_model_recovers_from_a_single_input_overflow -- --ignored --nocapture
      - name: Build and inspect the combined installer
        run: |
          python3 scripts/build-macos-installer.py --community \
            --app target/release/bundle/macos/OpenKrisp.app \
            --output target/community.pkg
          python3 scripts/verify-installers.py target/community.pkg
      - name: Stage macOS installer
        run: |
          mkdir -p target/installers
          cp target/community.pkg target/installers/macos.pkg
          cp target/release/bundle/macos/OpenKrisp.app.tar.gz target/installers/macos.app.tar.gz
          cp target/release/bundle/macos/OpenKrisp.app.tar.gz.sig target/installers/macos.app.tar.gz.sig
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-macos-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          path: |
            target/installers/macos.pkg
            target/installers/macos.app.tar.gz
            target/installers/macos.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-linux:
    name: Build Linux ${{ matrix.format }} (x86-64)
    needs: [validate, tag]
    if: >-
      always() && needs.validate.result == 'success' && needs.validate.outputs.ready == 'true' &&
      needs.validate.outputs.operation == 'prepare' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: rust:1.98-slim-bookworm
          - format: rpm
            image: fedora:44
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_FORMAT: ${{ matrix.format }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      OPENKRISP_UPDATER_PUBLIC_KEY: ${{ vars.OPENKRISP_UPDATER_PUBLIC_KEY }}
    steps:
      # Bootstrap before checkout because minimal images do not all contain Git.
      - name: Install Debian build prerequisites
        if: matrix.format == 'deb'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            git curl ca-certificates build-essential pkg-config file patchelf \
            python3 python3-venv libasound2-dev libpipewire-0.3-dev libclang-dev \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install Fedora build prerequisites
        if: matrix.format == 'rpm'
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            git curl-minimal ca-certificates gcc gcc-c++ make pkgconf-pkg-config file patchelf \
            tar gzip xz findutils python3 python3-pip alsa-lib-devel pipewire-devel clang-devel \
            webkit2gtk4.1-devel openssl-devel libayatana-appindicator-gtk3-devel librsvg2-devel \
            libxdo-devel rpm-build cpio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Fetch locked dependencies and collect Linux notices
        run: |
          test "$(uname -m)" = x86_64
          python3 -m venv target/aec-tools
          target/aec-tools/bin/python -m pip install meson==1.9.2 ninja==1.13.0
          npm ci --prefix apps/desktop
          cargo fetch --locked
          python3 scripts/prepare-release-notices.py --target x86_64-unknown-linux-gnu --fetch-missing
      - name: Build optimized Linux package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$OPENKRISP_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          python3 scripts/build-linux-release.py --format "$PACKAGE_FORMAT" --version "$RELEASE_VERSION"
      - name: Check release metadata, runtime dependencies, and bundled notices
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify-installers.py --release-version "$RELEASE_VERSION" \
            target/release/bundle/"$PACKAGE_FORMAT"/*."$PACKAGE_FORMAT"
          mkdir -p target/installers
          cp target/release/bundle/"$PACKAGE_FORMAT"/*."$PACKAGE_FORMAT" "target/installers/linux.$PACKAGE_FORMAT"
          cp target/release/bundle/"$PACKAGE_FORMAT"/*."$PACKAGE_FORMAT".sig "target/installers/linux.$PACKAGE_FORMAT.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-linux-${{ matrix.format }}-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          path: |
            target/installers/linux.${{ matrix.format }}
            target/installers/linux.${{ matrix.format }}.sig
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  install-linux:
    name: Install package on ${{ matrix.image }}
    needs: [validate, build-linux]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim
            format: deb
          - image: ubuntu:24.04
            format: deb
          - image: fedora:44
            format: rpm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-linux-${{ matrix.format }}-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          path: target/installers/
      - name: Install DEB with its declared dependencies
        if: matrix.format == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends "$PWD/target/installers/linux.deb"
      - name: Install RPM with its declared dependencies
        if: matrix.format == 'rpm'
        run: dnf install --assumeyes --setopt=install_weak_deps=False "$PWD/target/installers/linux.rpm"
      - name: Verify installed libraries and audio tools
        run: |
          test -x /usr/bin/openkrisp-desktop
          ldd /usr/bin/openkrisp-desktop | tee "$RUNNER_TEMP/openkrisp-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/openkrisp-ldd.txt"; then exit 1; fi
          pipewire --version
          pw-loopback --version
          wireplumber --version
          pipewire-pulse --version

  assemble:
    name: Assemble the complete macOS and Linux release
    needs: [validate, build-macos, build-linux, install-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          merge-multiple: true
          path: target/installers/
      - name: Assemble all installers, source, guides, provenance, and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_CI_RUN_ID: ${{ needs.validate.outputs.ci_run }}
        run: |
          python3 scripts/github-release.py package --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --installer target/installers/macos.pkg --deb target/installers/linux.deb --rpm target/installers/linux.rpm \
            --macos-update target/installers/macos.app.tar.gz --macos-signature target/installers/macos.app.tar.gz.sig \
            --deb-signature target/installers/linux.deb.sig --rpm-signature target/installers/linux.rpm.sig
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft:
    name: Upload and verify draft release
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: community-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          path: target/release-assets/
      - name: Stage the verified files without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/github-release.py prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  publish:
    name: Publish the existing verified draft
    needs: validate
    if: needs.validate.outputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-assets-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify successful preparation and publish the same files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/github-release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
