name: Release
run-name: ${{ inputs.operation }} ${{ inputs.tag }}

# Nothing publishes on push, tag creation, or merge. Both operations are explicit.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a draft, or publish its verified files without rebuilding
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      tag:
        description: Existing version tag on main (for example v0.1.0-beta.2)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag, version, and CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      version: ${{ steps.validate.outputs.version }}
      ci_run: ${{ steps.validate.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require a matching version and successful main CI
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github-release.py validate --tag "$RELEASE_TAG"

  build:
    name: Build and verify Apple Silicon installer
    needs: validate
    if: inputs.operation == 'prepare'
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_CI_RUN_ID: ${{ needs.validate.outputs.ci_run }}
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      APPLE_SIGNING_IDENTITY: '-'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check native target and install build dependencies
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv target/aec-tools
          target/aec-tools/bin/python -m pip install meson==1.9.2 ninja==1.13.0
          npm ci --prefix apps/desktop
          cargo fetch --locked
      - name: Collect pinned dependency notices and source archives
        run: python3 scripts/prepare-release-notices.py --target aarch64-apple-darwin --fetch-missing
      - name: Build optimized community app
        run: |
          npm run --prefix apps/desktop tauri -- build --ci \
            --config src-tauri/tauri.community.conf.json -- --locked --offline
          codesign --verify --deep --strict target/release/bundle/macos/OpenKrisp.app
          test "$(lipo -archs target/release/bundle/macos/OpenKrisp.app/Contents/MacOS/openkrisp-desktop)" = arm64
      - name: Run installer tests and release performance checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          cargo test --release --locked --offline -p audio-engine --features aec-prototype \
            production_aec_dfn_graph_timing -- --ignored --nocapture
          cargo test --release --locked --offline -p audio-engine --test dfn_recovery \
            production_model_recovers_from_a_single_input_overflow -- --ignored --nocapture
      - name: Build and inspect the combined installer
        run: |
          python3 scripts/build-macos-installer.py --community \
            --app target/release/bundle/macos/OpenKrisp.app \
            --output target/community.pkg
          python3 scripts/verify-installers.py target/community.pkg
      - name: Assemble source, guide, provenance, and checksums
        run: |
          python3 scripts/github-release.py package --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" --installer target/community.pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-${{ inputs.tag }}-${{ github.run_attempt }}
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft:
    name: Upload and verify draft release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: community-${{ inputs.tag }}-${{ github.run_attempt }}
          path: target/release-assets/
      - name: Stage the verified files without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/github-release.py prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  publish:
    name: Publish the existing verified draft
    needs: validate
    if: inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify successful preparation and publish the same files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/github-release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
