name: Self-hosted runner connectivity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/self-hosted-smoke.yml
      - .github/runners/**
      - scripts/self-hosted-runner.py
      - scripts/self-hosted-linux.py

permissions:
  contents: read

jobs:
  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, openkrisp]
    timeout-minutes: 5
    steps:
      - name: Verify native runner and GitHub log delivery
        run: |
          uname -sm
          sw_vers
          printf 'Self-hosted macOS runner connected successfully.\n' >> "$GITHUB_STEP_SUMMARY"
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, openkrisp]
    timeout-minutes: 5
    steps:
      - name: Verify isolated Linux runner, Docker and GitHub log delivery
        run: |
          uname -sm
          docker info --format '{{.OSType}}/{{.Architecture}}'
          test -r /proc/sys/fs/binfmt_misc/qemu-x86_64
          printf 'Self-hosted Linux runner connected successfully.\n' >> "$GITHUB_STEP_SUMMARY"
  linux-release:
    name: Hosted Linux release runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify native x86-64 release runner and Docker
        run: |
          test "$(uname -m)" = x86_64
          docker info --format '{{.OSType}}/{{.Architecture}}'
          printf 'Hosted x86-64 Linux release runner connected successfully.\n' >> "$GITHUB_STEP_SUMMARY"
