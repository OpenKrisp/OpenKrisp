name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-automation:
    name: Release workflow and guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate workflow syntax and expressions
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
      - name: Exercise release validation and publication guards without GitHub writes
        run: python3 -m unittest discover -s scripts/tests -p test_github_release.py -v
      - name: Exercise changelog synchronization without GitHub writes
        run: python3 -m unittest discover -s scripts/tests -p test_changelog.py -v

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Full workspace, native audio and installer builds must fit on hosted runners.
      # Keep debug assertions while omitting symbols and incremental build artifacts.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: compact-debug-v1

      - name: Install Linux audio and Tauri headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libasound2-dev
          libpipewire-0.3-dev
          libclang-dev
          pipewire-bin
          wireplumber
          dbus-x11
          libayatana-appindicator3-dev
          librsvg2-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          pkg-config
          rpm
          xvfb
          xauth

      - name: Build desktop frontend assets
        run: npm ci --prefix apps/desktop && npm run --prefix apps/desktop build

      - name: Install pinned native AEC build tools
        run: |
          # A restored target cache can contain an incomplete or stale Python environment.
          python3 -m venv --clear target/aec-tools
          target/aec-tools/bin/python -m pip install meson==1.9.2 ninja==1.13.0

      - name: Check formatting
        run: cargo ci-fmt
      - name: Lint
        run: cargo ci-clippy
      - name: Lint engine without AEC
        run: cargo clippy --locked -p audio-engine --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo ci-test --locked
      - name: Test engine without AEC
        run: cargo test --locked -p audio-engine --all-targets --no-default-features
      - name: Check native AEC alignment contracts
        run: python3 scripts/probe-aec-suppression.py debug --alignment
      - name: Exercise an isolated PipeWire virtual cable
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/test-linux-pipewire.sh

      - name: Run offline DeepFilterNet spike
        run: cargo run --locked -p denoise-dfn --example offline_inference

      - name: Test installer integrity and upgrade decisions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build desktop packages
        run: npm run --prefix apps/desktop tauri -- build --debug
      - name: Verify Linux package dependencies
        if: runner.os == 'Linux'
        run: python3 scripts/verify-installers.py target/debug/bundle/deb/*.deb target/debug/bundle/rpm/*.rpm
      - name: Build and inspect combined macOS installer
        if: runner.os == 'macOS'
        run: |
          python3 scripts/build-macos-installer.py --development \
            --app target/debug/bundle/macos/OpenKrisp.app \
            --output target/debug/bundle/pkg/OpenKrisp-dev.pkg
          python3 scripts/verify-installers.py target/debug/bundle/pkg/OpenKrisp-dev.pkg

      - name: Build dedicated native desktop smoke bundle
        run: npm run --prefix apps/desktop tauri -- build --debug --features desktop-smoke --bundles ${{ runner.os == 'macOS' && 'app' || 'deb' }} -- --locked
      - name: Exercise native macOS window lifecycle and packaged startup
        if: runner.os == 'macOS'
        run: python3 scripts/test-desktop-native.py target/debug/bundle/macos/OpenKrisp.app/Contents/MacOS/openkrisp-desktop
      - name: Exercise native Linux window lifecycle and packaged startup
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          mkdir -p target/native-smoke
          dpkg-deb --extract target/debug/bundle/deb/*.deb target/native-smoke
          xvfb-run --auto-servernum dbus-run-session -- python3 scripts/test-desktop-native.py target/native-smoke/usr/bin/openkrisp-desktop
      - name: Preserve native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-smoke-${{ matrix.os }}
          path: target/test-evidence/native/
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.98.0"
          command: check licenses

  installer-dependencies:
    name: Audio dependencies (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rust:1.98-slim-bookworm
            script: scripts/test-debian-audio-dependencies.sh
          - image: fedora:44
            script: scripts/test-fedora-audio-dependencies.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies in a disposable container
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace '${{ matrix.image }}' bash '${{ matrix.script }}'

  release-toolchains:
    name: Release toolchain (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rust:1.98-slim-bookworm
            family: debian
          - image: fedora:44
            family: fedora
    steps:
      - name: Install Debian setup prerequisites
        if: matrix.family == 'debian'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git curl ca-certificates
      - name: Install Fedora setup prerequisites
        if: matrix.family == 'fedora'
        run: dnf install --assumeyes --setopt=install_weak_deps=False git curl-minimal ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Exercise the repository toolchain without a command-line override
        run: |
          rustc --version | grep '^rustc 1\.98\.0 '
          cargo --version | grep '^cargo 1\.98\.0 '
          cargo fmt --version
          cargo clippy --version
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
