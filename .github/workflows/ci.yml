name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux audio and Tauri headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libasound2-dev
          libpipewire-0.3-dev
          libclang-dev
          pipewire-bin
          wireplumber
          dbus-x11
          libayatana-appindicator3-dev
          librsvg2-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          pkg-config
          rpm

      - name: Build desktop frontend assets
        run: npm ci --prefix apps/desktop && npm run --prefix apps/desktop build

      - name: Check formatting
        run: cargo ci-fmt
      - name: Lint
        run: cargo ci-clippy
      - name: Test
        run: cargo ci-test --locked
      - name: Exercise an isolated PipeWire virtual cable
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/test-linux-pipewire.sh

      - name: Run offline DeepFilterNet spike
        run: cargo run --locked -p denoise-dfn --example offline_inference

      - name: Test installer integrity and upgrade decisions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build desktop packages
        run: npm run --prefix apps/desktop tauri -- build --debug
      - name: Verify Linux package dependencies
        if: runner.os == 'Linux'
        run: python3 scripts/verify-installers.py target/debug/bundle/deb/*.deb target/debug/bundle/rpm/*.rpm
      - name: Build and inspect combined macOS installer
        if: runner.os == 'macOS'
        run: |
          python3 scripts/build-macos-installer.py --development \
            --app target/debug/bundle/macos/OpenKrisp.app \
            --output target/debug/bundle/pkg/OpenKrisp-dev.pkg
          python3 scripts/verify-installers.py target/debug/bundle/pkg/OpenKrisp-dev.pkg

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.98.0"
          command: check licenses

  installer-dependencies:
    name: Audio dependencies (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rust:1.98-slim-bookworm
            script: scripts/test-debian-audio-dependencies.sh
          - image: fedora:44
            script: scripts/test-fedora-audio-dependencies.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies in a disposable container
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace '${{ matrix.image }}' bash '${{ matrix.script }}'
