[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }
