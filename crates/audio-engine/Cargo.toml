[package]
name = "audio-engine"
description = "Audio route orchestration for OpenKrisp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
aec-webrtc = { path = "../aec-webrtc", optional = true }
audio-cpal = { path = "../audio-cpal" }
audio-dsp = { path = "../audio-dsp" }
audio-protocol = { path = "../audio-protocol" }
ctrlc.workspace = true
denoise-core = { path = "../denoise-core" }
denoise-dfn = { path = "../denoise-dfn" }
platform-routing = { path = "../platform-routing" }
ringbuf.workspace = true
thiserror.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
audio-cpal = { path = "../audio-cpal", features = ["test-support"] }
cpal.workspace = true

[features]
aec-prototype = ["dep:aec-webrtc"]

[[example]]
name = "aec_duplex"
required-features = ["aec-prototype"]

[[example]]
name = "aec_live"
required-features = ["aec-prototype"]

[lints]
workspace = true
