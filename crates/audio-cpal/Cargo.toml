[package]
name = "audio-cpal"
description = "CPAL audio I/O adapter boundary for OpenKrisp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
audio-protocol = { path = "../audio-protocol" }
cpal.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }

[dev-dependencies]
allocation-counter.workspace = true

[lints]
workspace = true
